version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recoverai_postgres
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai_password
      POSTGRES_DB: recoverai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: recoverai_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoverai_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://recoverai:recoverai_password@postgres:5432/recoverai
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
